name: "reth"

services:
  reth:
    restart: unless-stopped
    image: ghcr.io/paradigmxyz/op-reth:latest
    ports:
      - "9001:9001" # metrics
      - "30303:30303" # eth/66 peering
      - "8545:8545" # rpc
      - "8551:8551" # engine
    volumes:
      - base_data:/data
      - logs:/root/logs
      - ./jwt:/root/jwt:ro
    pid: host
    command: >
      node
      -vvv
      --full
      --datadir /data
      --log.stdout.format log-fmt
      --discovery.port 30305
      --enable-discv5-discovery
      --discovery.v5.addr 0.0.0.0
      --discovery.v5.port 30306
      --discovery.v5.port.ipv6 30306
      --ws
      --ws.addr 0.0.0.0
      --ws.origins "*"
      --ws.port 8546
      --ws.api all 
      --http 
      --http.addr 0.0.0.0
      --http.corsdomain "*" 
      --http.port 8545
      --http.api all
      --authrpc.addr 0.0.0.0
      --authrpc.port 9551
      --authrpc.jwtsecret /root/jwt/jwt.hex
      --metrics 0.0.0.0:9001
      --chain "$RETH_CHAIN" 
      --rollup.sequencer-http $RETH_SEQUENCER_HTTP 
      --rollup.disable-tx-pool-gossip
    environment:
      - RETH_CHAIN=base
      - RETH_SEQUENCER_HTTP=https://mainnet-sequencer.base.org

  op-node:
    restart: unless-stopped
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:latest
    depends_on:
      - reth
    ports:
      - 9004:9004
    volumes:
      - ./jwt:/root/jwt:ro
    pid: host
    command: >
      op-node
      --network base-mainnet
      --syncmode execution-layer
      --l1 wss://eth.merkle.io
      --l1.trustrpc
      --l1.beacon https://ethereum-beacon-api.publicnode.com
      --l2 http://reth:9551
      --l2.jwt-secret /root/jwt/jwt.hex
      --l2.enginekind=reth
      --p2p.listen.tcp=9004
      --p2p.listen.udp=9004

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    depends_on:
      - reth
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    depends_on:
      - reth
      - prometheus
    ports:
      - 3000:3000
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning_temp/dashboards
    # 1. Copy dashboards from temp directory to prevent modifying original host files
    # 2. Replace Prometheus datasource placeholder with the actual name
    # 3. Run Grafana
    entrypoint: >
      sh -c "cp -r /etc/grafana/provisioning_temp/dashboards/. /etc/grafana/provisioning/dashboards &&
             find /etc/grafana/provisioning/dashboards/ -name '*.json' -exec sed -i 's/$${DS_PROMETHEUS}/Prometheus/g' {} \+ &&
             /run.sh"

volumes:
  base_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/base_data
  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/logs
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/prometheus_data
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/grafana_data
